[project]
name = "m365-admin-mcp"
version = "0.1.0"
description = "A small, read-only Microsoft 365 admin MCP server for Claude."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "msal>=1.28.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
